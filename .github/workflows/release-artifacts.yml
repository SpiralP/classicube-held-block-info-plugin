name: release-artifacts

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write # for gh release upload

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
      skip-nix-build: true

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # for gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            classicube_held_block_info_windows_x86_64/classicube_held_block_info_windows_x86_64.dll \
            classicube_held_block_info_linux_x86_64/classicube_held_block_info_linux_x86_64.so
